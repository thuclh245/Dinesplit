<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Register - DineSplit Social</title>

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;

<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar Shell (Transactional Variant: Centered & Simplified) -->
<header class="fixed top-0 w-full z-50 bg-white/80 dark:bg-zinc-900/80 backdrop-blur-xl shadow-[0_4px_30px_rgba(0,0,0,0.03)]">
<div class="flex justify-between items-center px-6 py-4 w-full max-w-md mx-auto">
<button class="text-orange-600 dark:text-orange-400 active:scale-95 duration-200 hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-xl font-extrabold tracking-tighter text-zinc-900 dark:text-zinc-50 headline-font">DineSplit</h1>
<button class="text-orange-600 dark:text-orange-400 font-bold hover:opacity-80 transition-opacity headline-font text-sm">Help</button>
</div>
</header>
<main class="w-full max-w-md px-8 pt-24 pb-12">
<!-- Editorial Hero Section -->
<div class="mb-12">
<h2 class="text-5xl font-extrabold headline-font text-on-surface tracking-tighter leading-none mb-4">
                Join the <span class="text-primary">Table.</span>
</h2>
<p class="text-on-surface-variant font-medium tracking-tight">Create your Social Ledger account to start splitting memories, not just bills.</p>
</div>
<!-- Registration Form -->
<form class="space-y-6">
<!-- Display Name -->
<div class="space-y-1">
<label class="label-md uppercase tracking-widest text-[10px] font-bold text-on-surface-variant ml-1">Display Name</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="person">person</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary/20 placeholder:text-outline text-on-surface font-medium transition-all" placeholder="Foodie Traveler" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-1">
<label class="label-md uppercase tracking-widest text-[10px] font-bold text-on-surface-variant ml-1">Email Address</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="mail">mail</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary/20 placeholder:text-outline text-on-surface font-medium transition-all" placeholder="hello@dinesplit.com" type="email"/>
</div>
</div>
<!-- Password Grid (Asymmetric Layout for inputs) -->
<div class="grid grid-cols-1 gap-6">
<!-- Password -->
<div class="space-y-1">
<label class="label-md uppercase tracking-widest text-[10px] font-bold text-on-surface-variant ml-1">Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock">lock</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-12 focus:ring-2 focus:ring-primary/20 placeholder:text-outline text-on-surface font-medium transition-all" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-4 flex items-center text-on-surface-variant hover:text-primary" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Confirm Password -->
<div class="space-y-1">
<label class="label-md uppercase tracking-widest text-[10px] font-bold text-on-surface-variant ml-1">Confirm Password</label>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none text-on-surface-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-[20px]" data-icon="lock_reset">lock_reset</span>
</div>
<input class="w-full bg-surface-container-highest border-none rounded-xl py-4 pl-12 pr-12 focus:ring-2 focus:ring-primary/20 placeholder:text-outline text-on-surface font-medium transition-all" placeholder="••••••••" type="password"/>
</div>
</div>
</div>
<!-- Terms Acceptance -->
<div class="flex items-start gap-3 px-1 py-2">
<input class="mt-1 rounded border-outline-variant text-primary focus:ring-primary/20 bg-surface-container-lowest" id="terms" type="checkbox"/>
<label class="text-xs text-on-surface-variant leading-relaxed" for="terms">
                    By registering, you agree to our <span class="text-primary font-bold">Terms of Service</span> and <span class="text-primary font-bold">Privacy Policy</span>. We handle your data with care.
                </label>
</div>
<!-- Primary Action -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-bold py-5 rounded-full shadow-[0_12px_24px_-8px_rgba(171,45,0,0.3)] hover:opacity-90 active:scale-95 transition-all headline-font text-lg tracking-tight" type="submit">
                Create Account
            </button>
</form>
<!-- Social Register Options -->
<div class="mt-12 text-center">
<div class="relative mb-8">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-surface-container-highest"></div></div>
<div class="relative flex justify-center text-xs uppercase tracking-widest font-bold bg-surface px-4 text-on-surface-variant">Or continue with</div>
</div>
<div class="flex gap-4 justify-center">
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container-lowest py-3 rounded-xl border border-outline-variant/15 active:scale-95 transition-transform">
<img alt="Google Logo" class="w-5 h-5" data-alt="clean multi-colored Google 'G' icon on a transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDpWtz23je5m8QkrgSxY1hqrDjt1DKEZ76ut_Cm8QeQRLBPHsAi9iPqcxSguk7cBDFu4WZRrH3QWg9pIgu3LdiwV-Tx2a0SXTLMK09ccp1RjZIAeylTpK6eW4YJztV_7lSJ5QuCOobycH1z6FYrl6tmau9FeGqrWtMCVmKps7wLwKNj69piYwl40TEYqfXG1YZkNvX-dAtkvcvT1jhTmEDaKaU1XG0DOwoiPWhk8zBdb_eVZ9Vcjr95baVidGx4Qmd3h8jNcIRvYn0"/>
<span class="text-sm font-bold headline-font">Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 bg-surface-container-lowest py-3 rounded-xl border border-outline-variant/15 active:scale-95 transition-transform">
<span class="material-symbols-outlined text-[20px] text-zinc-900" data-icon="apple">ios</span>
<span class="text-sm font-bold headline-font">Apple</span>
</button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-12 text-center text-on-surface-variant font-medium">
            Already have an account? <a class="text-primary font-bold" href="#">Sign In</a>
</p>
</main>
<!-- Visual Polish: Background Decorative Element -->
<div class="fixed bottom-0 right-0 -z-10 w-64 h-64 bg-primary/5 rounded-full blur-3xl translate-x-1/2 translate-y-1/2"></div>
<div class="fixed top-0 left-0 -z-10 w-96 h-96 bg-secondary-container/10 rounded-full blur-3xl -translate-x-1/2 -translate-y-1/2"></div>
</body></html>

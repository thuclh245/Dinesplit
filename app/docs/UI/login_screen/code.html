<!DOCTYPE html>

<meta charset="utf-8"/>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f6f6f6;
            color: #2d2f2f;
        }
        .editorial-shadow {
            box-shadow: 0 24px 48px -12px rgba(45, 47, 47, 0.06);
        }
        .glass-effect {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="antialiased overflow-x-hidden">
<!-- Hero Visual Background -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-gradient-to-b from-primary/5 to-surface opacity-60"></div>
<img alt="high-end restaurant interior with soft ambient lighting and blurred dinner guests" class="w-full h-full object-cover opacity-10 mix-blend-multiply" data-alt="Blurred background of a high-end modern restaurant with warm lighting and people enjoying a meal to create a social dining atmosphere" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpYLrxFBohbap3Bx8DQPARiGC474ysLoH3IgnXXOtMDH-JOWwSqZqigIOWvJGBy7p-lX-qfCPXXGTmbi4LJ7E5-bvNMUkHF-6WF6zJoDhRzigidqy4oSYBsyDPr2UkI29QUyT2J7sbgmZpxVkn3hbRGF_ibc-mwBEva8KH6FIiEamruFGPx0H1BQ4YDqg5l0Oc3hKvTSp2WEBJM6EevXhWkt0-4_KwWqQXl5AhW5H5m8lloE9pl2mLIXk86ZvXbKvR296mZuDF5hI"/>
</div>
<!-- Navigation suppressed for Login screen as per "The Destination Rule" -->
<main class="relative z-10 min-h-screen flex flex-col items-center justify-center px-6 py-12 max-w-md mx-auto">
<!-- Brand Identity Section -->
<header class="text-center mb-12">
<div class="w-16 h-16 bg-gradient-to-br from-primary to-primary-container rounded-2xl flex items-center justify-center mx-auto mb-6 editorial-shadow">
<span class="material-symbols-outlined text-on-primary text-3xl" data-icon="restaurant_menu">restaurant_menu</span>
</div>
<h1 class="font-headline font-extrabold text-4xl tracking-tighter text-on-background mb-2">DineSplit</h1>
<p class="font-body text-on-surface-variant tracking-wide uppercase text-[10px] font-bold">The Social Ledger</p>
</header>
<!-- Form Container -->
<section class="w-full space-y-8">
<div class="space-y-4">
<!-- Email Input -->
<div class="space-y-1">
<label class="font-label text-[11px] font-bold text-on-surface-variant uppercase tracking-widest px-1">Email Address</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-xl px-5 font-body text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all editorial-shadow" placeholder="jane.doe@example.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="space-y-1">
<label class="font-label text-[11px] font-bold text-on-surface-variant uppercase tracking-widest px-1">Password</label>
<div class="relative flex items-center">
<input class="w-full h-14 bg-surface-container-lowest border-none rounded-xl px-5 font-body text-on-surface placeholder:text-outline/50 focus:ring-2 focus:ring-primary/20 transition-all editorial-shadow" placeholder="••••••••" type="password"/>
<button class="absolute right-4 text-outline-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<div class="flex justify-end px-1">
<a class="font-label text-xs font-semibold text-primary hover:text-primary-dim transition-colors" href="#">Forgot Password?</a>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-4">
<button class="w-full h-14 bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-sm rounded-full editorial-shadow active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                    Sign In
                    <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="flex items-center gap-4 py-2">
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
<span class="font-label text-[10px] font-bold text-on-surface-variant uppercase tracking-widest">Or continue with</span>
<div class="h-[1px] flex-1 bg-surface-container-highest"></div>
</div>
<button class="w-full h-14 bg-white border border-outline-variant/20 text-on-surface font-headline font-bold text-sm rounded-full editorial-shadow active:scale-[0.98] transition-all flex items-center justify-center gap-3">
<img alt="Google Logo" class="w-5 h-5" data-alt="Official Google logo with vibrant primary colors on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3-5nU9KPj_Hs_UC9WFY9-eI6ZoanHilU8-FP0y2Z0yUjs__2H_sCJtrhbFEjh8z935q1mRmNyWkOKmTF31Qnr7UMVgXDUFaaY1i_Ll7DIKYx66AVwk18lQtplYDytARQ4c9gU4lxTrOhSIM5U48S4u_tcqAj821pr1082nimz0kbaFPFdlsPcphSKqv8EXbeYZdO1J8vArnX_cJH7xINCj9b9W0BjV3JXowL_BBf4NQDyzZ483yfi3nG6z8L2cq6BuUGiOEyYR1U"/>
                    Google
                </button>
</div>
</section>
<!-- Footer Footer -->
<footer class="mt-16 text-center">
<p class="font-body text-sm text-on-surface-variant">
                New to the table? 
                <a class="text-secondary font-bold hover:underline ml-1" href="#">Create Account</a>
</p>
</footer>
<!-- Bottom Graphic/Surface Shift (Visual Anchor) -->
<div class="fixed bottom-0 left-0 w-full h-24 bg-gradient-to-t from-surface-container-low/50 to-transparent pointer-events-none"></div>
</main>
<!-- Contextual FAB suppressed for login screens -->
</body></html>
